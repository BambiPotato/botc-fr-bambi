markdown: kramdown
theme: jekyll-theme-slate

remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme

title: "Wiki Blood on the Clocktower Francophone"
description: "Traductions, conseils et ressources pour le jeu Blood on the Clocktower"

# ⚠️ IMPORTANT : séparation correcte domaine / repo
url: "https://bambipotato.github.io"
baseurl: "/botc-fr-bambi"

kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true
  parse_span_html: true

# fichiers supplémentaires à inclure dans la compilation
include:
  - assets/css/style.css
  - assets/js/theme.js
  - _includes/head-custom.html

# Autoriser les sous-dossiers à être traités comme des pages
collections:
  tb_roles:
    output: true
