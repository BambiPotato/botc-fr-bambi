<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre de l’onglet -->
    <title>
      {% if page.title %}
        {{ page.title }} – {{ site.title }}
      {% else %}
        Wiki francophone non officiel – Blood on the Clocktower
      {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- FAVICON -->
    <link rel="icon" href="{{ '/images/favicon.png?v=3' | relative_url }}">

    <!-- Open Graph / Partage réseaux sociaux -->
    <meta property="og:type" content="website">

    <meta property="og:title"
          content="{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}Wiki francophone non officiel – Blood on the Clocktower{% endif %}">

    <meta property="og:description"
          content="Wiki communautaire francophone non officiel de Blood on the Clocktower : rôles, règles et ressources.">

    <meta property="og:image"
          content="{{ '/images/og-wiki-botc-fr.png' | absolute_url }}">

    <meta property="og:url"
          content="{{ page.url | absolute_url }}">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title"
          content="{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}Wiki francophone non officiel – Blood on the Clocktower{% endif %}">

    <meta name="twitter:description"
          content="Wiki communautaire francophone non officiel de Blood on the Clocktower : rôles, règles et ressources.">

    <meta name="twitter:image"
          content="{{ '/images/og-wiki-botc-fr.png' | absolute_url }}">

  </head>

  <body>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
  </body>
</html>
  </body>
</html>
